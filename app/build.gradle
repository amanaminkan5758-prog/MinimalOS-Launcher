plugins {
    id 'com.android.application'
}

android {
    namespace "com.minimalos.launcher"
    compileSdk 34

    defaultConfig {
        applicationId "com.minimalos.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        release {
            def localProps = new Properties()
            def localPropsFile = rootProject.file('local.properties')
            if (localPropsFile.exists()) {
                localProps.load(new FileInputStream(localPropsFile))
            }
            storeFile rootProject.file(localProps['RELEASE_STORE_FILE'] ?: 'keystore/release-key.jks')
            storePassword localProps['RELEASE_STORE_PASSWORD']
            keyAlias localProps['RELEASE_KEY_ALIAS']
            keyPassword localProps['RELEASE_KEY_PASSWORD']
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}
